[package]
name = "uv-configuration"
version = "0.0.39"
description = "This is an internal component crate of uv"
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
uv-auth = { workspace = true, optional = true }
uv-cache = { workspace = true, optional = true }
uv-cache-info = { workspace = true, optional = true }
uv-distribution-types = { workspace = true }
uv-git = { workspace = true, optional = true }
uv-normalize = { workspace = true }
uv-pep440 = { workspace = true }
uv-pep508 = { workspace = true, features = ["schemars"] }
uv-platform-tags = { workspace = true }
uv-redacted = { workspace = true }
uv-static = { workspace = true }

clap = { workspace = true, features = ["derive"], optional = true }
either = { workspace = true }
fs-err = { workspace = true }
rayon = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustc-hash = { workspace = true }
same-file = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
tokio = { workspace = true, optional = true }
serde-untagged = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
insta = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["native"]
native = [
  "dep:uv-auth",
  "dep:uv-cache",
  "dep:uv-cache-info",
  "dep:uv-git",
  "dep:rayon",
  "dep:reqwest",
  "dep:tokio",
  "uv-distribution-types/native",
]
